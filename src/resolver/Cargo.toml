[package]
name = "bogdan-resolver"
version.workspace = true
edition.workspace = true
description = "URL resolution engine with yt-dlp subprocess for boGDan"

[dependencies]
bogdan-tor = { path = "../tor" }
bogdan-session = { path = "../session" }
tokio = { workspace = true, features = ["process", "time", "sync", "rt", "macros", "io-util", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
rusqlite = { version = "0.39", features = ["bundled"] }
async-trait = { workspace = true }
tempfile = "3"
reqwest = { version = "0.12", features = ["rustls-tls", "cookies", "gzip", "brotli", "socks"], default-features = false }
scraper = "0.20"
base64 = "0.22"
regex-lite = "0.1"
toml = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
serde_json = { workspace = true }
mockito = "1"
