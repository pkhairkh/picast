[package]
name = "picast-resolver"
version.workspace = true
edition.workspace = true
description = "URL resolution engine with yt-dlp subprocess for PiCast"

[dependencies]
picast-tor = { path = "../tor" }
picast-session = { path = "../session" }
tokio = { workspace = true, features = ["process", "time", "sync", "rt", "macros", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = { workspace = true }
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
serde_json = { workspace = true }
