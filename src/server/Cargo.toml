[package]
name = "picast-server"
version.workspace = true
edition.workspace = true
description = "PiCast main binary — orchestrates all subsystems"

[[bin]]
name = "picast"
path = "src/main.rs"

[dependencies]
picast-protocols = { path = "../protocols" }
picast-session = { path = "../session" }
picast-resolver = { path = "../resolver" }
picast-playback = { path = "../playback" }
picast-display = { path = "../display" }
picast-tor = { path = "../tor" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
