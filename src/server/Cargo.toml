[package]
name = "bogdan-server"
version.workspace = true
edition.workspace = true
description = "boGDan main binary — orchestrates all subsystems"

[[bin]]
name = "bogdan"
path = "src/main.rs"

[features]
default = []
hw = ["bogdan-playback/hw", "bogdan-display/hw"]

[dependencies]
bogdan-protocols = { path = "../protocols" }
bogdan-session = { path = "../session" }
bogdan-resolver = { path = "../resolver" }
bogdan-playback = { path = "../playback", default-features = false }
bogdan-display = { path = "../display", default-features = false }
bogdan-tor = { path = "../tor" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
sd-notify = "0.4"
clap = { version = "4", features = ["std"] }
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
bogdan-tor = { path = "../tor" }
tempfile = "3"
tokio-tungstenite = "0.24"
futures-util = "0.3"
