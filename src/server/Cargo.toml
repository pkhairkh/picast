[package]
name = "picast-server"
version.workspace = true
edition.workspace = true
description = "PiCast main binary — orchestrates all subsystems"

[[bin]]
name = "picast"
path = "src/main.rs"

[features]
default = []
hw = ["picast-playback/hw", "picast-display/hw"]

[dependencies]
picast-protocols = { path = "../protocols" }
picast-session = { path = "../session" }
picast-resolver = { path = "../resolver" }
picast-playback = { path = "../playback", default-features = false }
picast-display = { path = "../display", default-features = false }
picast-tor = { path = "../tor" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
sd-notify = "0.4"
clap = { version = "4", features = ["std"] }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
picast-tor = { path = "../tor" }
tempfile = "3"
