[package]
name = "bogdan-tor"
version.workspace = true
edition.workspace = true
description = "Tor daemon lifecycle management and SOCKS5 proxy layer for boGDan"

[dependencies]
tokio = { workspace = true, features = ["process", "net", "time", "rt", "macros", "io-util"] }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", features = ["socks", "rustls-tls"], default-features = false }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
libc = "0.2"

[features]
default = []
tor-test = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
