<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boGDan</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon-32.png" alt="boGDan" class="logo">
        <h1>boGDan</h1>
      </div>
      <span class="status-dot" id="statusDot" title="Disconnected"></span>
    </header>

    <!-- URL Input -->
    <div class="input-group">
      <input type="text" inputmode="url" id="urlInput" class="url-input" placeholder="Paste URL or use current tab">
      <button id="tabBtn" class="btn-icon" title="Use current tab URL">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </div>

    <!-- Detected Media -->
    <div class="media-section" id="mediaSection" style="display:none">
      <div class="section-header">
        <span class="section-title">Detected Media</span>
        <span class="section-badge" id="mediaCount">0</span>
      </div>
      <div class="media-list" id="mediaList"></div>
    </div>

    <!-- Cast Button -->
    <button class="btn-cast" id="castBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
        <line x1="2" y1="20" x2="2.01" y2="20"/>
      </svg>
      Cast to boGDan
    </button>

    <!-- Playback Controls -->
    <div class="controls" id="controls">
      <div class="controls-row">
        <button class="btn-ctrl" id="resumeBtn" title="Resume" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
        </button>
        <button class="btn-ctrl" id="pauseBtn" title="Pause" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="btn-ctrl" id="stopBtn" title="Stop" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
        <button class="btn-ctrl" id="seekBackBtn" title="-10s" disabled>-10s</button>
        <button class="btn-ctrl" id="seekFwdBtn" title="+10s" disabled>+10s</button>
      </div>

      <!-- Volume -->
      <div class="volume-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" class="volume-slider" disabled>
        <span id="volumeLabel" class="volume-label">100%</span>
      </div>

      <!-- Progress (clickable seek bar) -->
      <div class="progress-row" id="progressRow" style="display:none">
        <span id="positionLabel">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span id="durationLabel">0:00</span>
      </div>

      <!-- Title display -->
      <div class="title-row" id="titleRow" style="display:none">
        <span id="titleText" class="title-text"></span>
      </div>

      <!-- Subtitle selector -->
      <div class="subtitle-row" id="subtitleRow" style="display:none">
        <label for="subtitleSelect">CC:</label>
        <select id="subtitleSelect" disabled>
          <option value="none">Off</option>
        </select>
      </div>
    </div>

    <!-- Status Box -->
    <div class="status-box" id="statusBox">
      <span id="statusText">Connecting to boGDan\u2026</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-link" id="settingsBtn">Settings</button>
      <span class="footer-sep">\u00B7</span>
      <button class="btn-link" id="reconnectBtn">Reconnect</button>
      <span class="footer-sep">\u00B7</span>
      <span class="footer-version">v0.3.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
