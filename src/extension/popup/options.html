<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PiCast Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 24px; background: #e50914; color: white; border: none; border-radius: 6px;
             cursor: pointer; font-size: 14px; font-weight: 600; }
    button:hover { background: #ff1a25; }
    .help { font-size: 12px; color: #666; margin-top: -12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>PiCast Settings</h1>

  <label for="piAddress">PiCast Receiver Address</label>
  <input type="text" id="piAddress" placeholder="picast.local">
  <div class="help">Hostname or IP address of your Raspberry Pi on the local network</div>

  <label for="piPort">HTTP API Port</label>
  <input type="number" id="piPort" value="8585">
  <div class="help">Default: 8585. Only change if you configured a custom port.</div>

  <label for="torMode">Tor Routing Mode</label>
  <select id="torMode">
    <option value="full">Full (all traffic through Tor)</option>
    <option value="resolution-only">Resolution Only (yt-dlp via Tor, media direct)</option>
    <option value="off">Off (no Tor, for testing only)</option>
  </select>
  <div class="help">Full mode provides maximum privacy. Resolution-only trades metadata privacy for playback quality. Off disables Tor entirely.</div>

  <button id="saveBtn">Save Settings</button>

  <script>
    // Load settings
    chrome.storage.local.get(
      { piAddress: "picast.local", piPort: 8585, torMode: "full" },
      (settings) => {
        document.getElementById("piAddress").value = settings.piAddress;
        document.getElementById("piPort").value = settings.piPort;
        document.getElementById("torMode").value = settings.torMode;
      }
    );

    // Save settings
    document.getElementById("saveBtn").addEventListener("click", () => {
      const settings = {
        piAddress: document.getElementById("piAddress").value.trim(),
        piPort: parseInt(document.getElementById("piPort").value, 10),
        torMode: document.getElementById("torMode").value,
      };
      chrome.storage.local.set(settings, () => {
        document.getElementById("saveBtn").textContent = "Saved!";
        setTimeout(() => {
          document.getElementById("saveBtn").textContent = "Save Settings";
        }, 2000);
      });
    });
  </script>
</body>
</html>
