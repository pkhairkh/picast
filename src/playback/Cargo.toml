[package]
name = "picast-playback"
version.workspace = true
edition.workspace = true
description = "GStreamer playback engine with V4L2 H.264 hardware decode for PiCast"

[features]
default = []
hw = ["gstreamer", "gstreamer-app", "gstreamer-video", "gstreamer-audio", "picast-display/hw"]

[dependencies]
picast-display = { path = "../display", default-features = false }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-audio = { version = "0.23", optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = { workspace = true }
