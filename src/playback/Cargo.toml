[package]
name = "bogdan-playback"
version.workspace = true
edition.workspace = true
description = "GStreamer playback engine with V4L2 H.264/H.265 hardware decode for boGDan"

[features]
default = []
hw = ["gstreamer", "bogdan-display/hw", "bogdan-v3d/hw"]
hevc = []  # Enable HEVC/H.265 decode support (requires V3D compute shader for SAND→NV12)

[dependencies]
bogdan-display = { path = "../display", default-features = false }
bogdan-v3d = { path = "../v3d", default-features = false }
gstreamer = { version = "0.23", optional = true }
# gstreamer-app = { version = "0.23", optional = true }    # Future: for AppSink/AppSrc
# gstreamer-video = { version = "0.23", optional = true }  # Future: for video caps helpers
# gstreamer-audio = { version = "0.23", optional = true }  # Future: for audio caps helpers
tokio = { workspace = true, features = ["sync", "time", "net", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
reqwest = { version = "0.13", features = ["rustls-tls", "stream", "http2"], default-features = false }
futures-util = "0.3"
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = { workspace = true }
