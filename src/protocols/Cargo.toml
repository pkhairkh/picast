[package]
name = "bogdan-protocols"
version.workspace = true
edition.workspace = true
description = "HTTP REST API, WebSocket, and DLNA protocol servers for boGDan"

[dependencies]
bogdan-session = { path = "../session" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
libc = "0.2"
# TLS (rustls — pure Rust, no OpenSSL)
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = { workspace = true }
