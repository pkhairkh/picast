[package]
name = "bogdan-display"
version.workspace = true
edition.workspace = true
description = "DRM/KMS atomic modesetting display manager for boGDan on Raspberry Pi 4B+"

[features]
default = []
hw = ["drm"]

[dependencies]
drm = { version = "0.12", optional = true }
# gbm = { version = "0.2", optional = true }  # Future: for GBM buffer allocation
# nix = { version = "0.28", features = ["ioctl"], optional = true }  # Future: for raw ioctls
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
