[package]
name = "picast-display"
version.workspace = true
edition.workspace = true
description = "DRM/KMS atomic modesetting display manager for PiCast on Raspberry Pi 4B+"

[features]
default = []
hw = ["drm", "gbm", "nix"]

[dependencies]
drm = { version = "0.12", optional = true }
gbm = { version = "0.2", optional = true }
nix = { version = "0.28", features = ["ioctl"], optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
