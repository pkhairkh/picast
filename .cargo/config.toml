# boGDan cross-compilation configuration
#
# For building on x86_64 host targeting Raspberry Pi 4B+ (aarch64):
#
#   cargo build --target aarch64-unknown-linux-gnu --workspace
#
# Prerequisites:
#   sudo apt install gcc-aarch64-linux-gnu
#
# For the `hw` feature (GStreamer, DRM, GBM), you also need the
# aarch64 sysroot with Pi-specific libraries. Use `cross` or
# set up the sysroot manually:
#
#   cross build --target aarch64-unknown-linux-gnu --features hw

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
