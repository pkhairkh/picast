[workspace]
members = [
    "src/server",
    "src/protocols",
    "src/session",
    "src/resolver",
    "src/playback",
    "src/display",
    "src/tor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
bytes = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
