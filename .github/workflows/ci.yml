name: boGDan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # System dependencies needed by most jobs
  SYSTEM_DEPS: >-
    libgstreamer1.0-dev
    libgstreamer-plugins-base1.0-dev
    libdrm-dev
    libgbm-dev
    libsqlite3-dev

jobs:
  # ── Dependency review ─────────────────────────────────────────────────
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # ── Format check ────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  # ── Clippy lint ─────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.SYSTEM_DEPS }}
      - uses: Swatinem/rust-cache@v2
      # Run clippy WITHOUT the hw feature (x86 CI can't use Pi-specific libs)
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also check with the hw feature to catch any compile errors
      - run: cargo clippy --workspace --all-targets --features hw -- -D warnings
        continue-on-error: true  # hw deps may not be fully available on CI

  # ── Build check (x86_64, no hw feature) ─────────────────────────────
  check-x86:
    name: check (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.SYSTEM_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check --workspace --features hw
        continue-on-error: true

  # ── Tests ───────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.SYSTEM_DEPS }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --workspace
      - run: cargo test --workspace --features hw
        continue-on-error: true  # hw tests need Pi hardware

  # ── Coverage ────────────────────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.SYSTEM_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --workspace --ignore-tests --out Xml --skip-clean
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Cross-compile check (aarch64) ──────────────────────────────────
  check-aarch64:
    name: check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation toolchain & system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libdrm-dev \
            libgbm-dev \
            libsqlite3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - name: Configure aarch64 linker
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
      # Cross-compile check without hw feature (no Pi-specific sysroot)
      - run: cargo check --target aarch64-unknown-linux-gnu --workspace
        continue-on-error: true  # May fail due to missing sysroot deps

  # ── Documentation build ────────────────────────────────────────────
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.SYSTEM_DEPS }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Security audit ─────────────────────────────────────────────────
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ── CI success gate ────────────────────────────────────────────────
  ci-success:
    name: ci-success
    if: always()
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - fmt
      - clippy
      - check-x86
      - test
      - coverage
      - check-aarch64
      - docs
      - audit
    steps:
      - name: Check all jobs passed
        run: |
          echo "Checking job results..."
          # dependency-review is PR-only; treat skipped as success
          if [ "${{ needs.dependency-review.result }}" = "failure" ]; then
            echo "::error::dependency-review failed"
            exit 1
          fi
          for result in ${{ needs.fmt.result }} ${{ needs.clippy.result }} ${{ needs.test.result }} ${{ needs.coverage.result }} ${{ needs.check-aarch64.result }} ${{ needs.check-x86.result }} ${{ needs.docs.result }} ${{ needs.audit.result }}; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Job failed with result: $result"
              exit 1
            fi
          done
          echo "All jobs passed!"
