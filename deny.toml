# PiCast — cargo-deny Configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
vulnerability = "deny"
unmaintained = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
]
unlicensed = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "openssl"
reason = "Use rustls instead of OpenSSL for a pure-Rust TLS stack with no system dependency"

[[bans.deny]]
name = "curl"
reason = "Use hyper/reqwest with rustls instead of libcurl to reduce attack surface and simplify cross-compilation"
